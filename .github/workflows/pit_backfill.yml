name: Point-in-time constituent backfill

# Scores historical index members that were never scored (see backfill_queue.json).
# The live season has priority: five overnight runs only, after the day's live
# digest (19:24 UTC) and refresh (21:30 UTC) have finished, and a hard daily cap
# on backfill scoring (BACKFILL_DAILY_CAP) so the morning digest keeps its quota.
# Does nothing once the queue is empty.
on:
  schedule:
    # GitHub drops scheduled runs under load (1 of 5 fired on the first night), so offer
    # more overnight slots; the daily cap, not the slot count, bounds the work.
    - cron: "25 * * * *"
  workflow_dispatch:

concurrency:
  group: pit-backfill
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill one step
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:     ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          FACTSET_USERNAME:   ${{ secrets.FACTSET_USERNAME }}
          FACTSET_API_KEY:    ${{ secrets.FACTSET_API_KEY }}
          BACKFILL_BUDGET_S:  "2900"
          BACKFILL_DAILY_CAP: "900"
          BACKFILL_FORCE:     "1"
        run: python scripts/pit_backfill_step.py

      - name: Commit progress
        if: always()
        run: |
          git config user.name  "earnings-monitor-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "PIT backfill $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push

      # GitHub's scheduler skips most hourly slots, so a productive run starts the next
      # one itself. A run that scored nothing (cap reached, throttled, queue empty) ends
      # the chain; the hourly schedule restarts it.
      - name: Chain next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python -c "import json;l=json.load(open('backfill_log.json'));print(int(l[-1].get('scored') or 0) if l else 0)")
          if [ "$N" -gt 0 ]; then gh workflow run pit_backfill.yml --ref main; echo "chained (last run scored $N)"; else echo "not chaining"; fi
