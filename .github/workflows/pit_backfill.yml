name: Point-in-time constituent backfill

# Scores historical index members that were never scored (see backfill_queue.json).
# The live season has priority: five overnight runs only, after the day's live
# digest (19:24 UTC) and refresh (21:30 UTC) have finished, and a hard daily cap
# on backfill scoring (BACKFILL_DAILY_CAP) so the morning digest keeps its quota.
# Does nothing once the queue is empty.
on:
  schedule:
    - cron: "40 22,23,0,2,4 * * *"
  workflow_dispatch:

concurrency:
  group: pit-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill one step
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:     ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          FACTSET_USERNAME:   ${{ secrets.FACTSET_USERNAME }}
          FACTSET_API_KEY:    ${{ secrets.FACTSET_API_KEY }}
          BACKFILL_BUDGET_S:  "2900"
          BACKFILL_DAILY_CAP: "500"
        run: python scripts/pit_backfill_step.py

      - name: Commit progress
        if: always()
        run: |
          git config user.name  "earnings-monitor-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "PIT backfill $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push
