name: Daily Research Refresh

on:
  schedule:
    # 21:30 UTC (5:30 PM ET) Mon–Fri — after same-day morning transcripts post
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests anthropic numpy

      - name: Refund sweep (resumed — only new reporters)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTSET_USERNAME:  ${{ secrets.FACTSET_USERNAME }}
          FACTSET_API_KEY:   ${{ secrets.FACTSET_API_KEY }}
        run: python scripts/refund_watch_run.py --start 2026-07-15 --scores pmi_scores.json --resume

      - name: AI sweep (resumed — only new reporters)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTSET_USERNAME:  ${{ secrets.FACTSET_USERNAME }}
          FACTSET_API_KEY:   ${{ secrets.FACTSET_API_KEY }}
        run: python scripts/ai_watch_run.py --start 2026-07-15 --scores pmi_scores.json --out ai_highlights_q2.json --model claude-haiku-4-5-20251001 --resume

      - name: Rebuild dashboards
        run: python scripts/build_dashboards.py

      - name: Commit data + pages
        run: |
          git config user.name  "earnings-monitor-bot"
          git config user.email "actions@github.com"
          git add ai_highlights_q2.json refund_highlights.json \
                  ai_highlights_q2.json.done refund_highlights.json.done \
                  docs/research 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily research refresh $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: Deploy to website (SFTP)
        env:
          DEPLOY_SERVER:   ${{ secrets.FTP_SERVER }}
          DEPLOY_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          echo "CHECK 1 OK: private key parses"
          printf 'pwd\nbye\n' | sftp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "$DEPLOY_USERNAME@$DEPLOY_SERVER"
          echo "CHECK 2 OK: SFTP auth works"
          timeout 300 lftp -u "$DEPLOY_USERNAME", \
            -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes'; mirror -R --only-newer --verbose docs/research doc_root/research; bye" \
            "sftp://$DEPLOY_SERVER" \
            || { echo '::error::mirror failed after auth succeeded — path issue'; exit 1; }
          echo "CHECK 3 OK: mirror complete"
