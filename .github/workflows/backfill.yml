name: Backfill PMI Scores
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-07-15"
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-09-03"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests anthropic
      - name: Run backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTSET_USERNAME:  ${{ secrets.FACTSET_USERNAME }}
          FACTSET_API_KEY:   ${{ secrets.FACTSET_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:    ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
        run: |
          python3 scripts/backfill_scores.py --start "${{ inputs.start }}" --end "${{ inputs.end }}"
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pmi_scores.json
          git diff --cached --quiet || git commit -m "Backfill PMI scores ${{ inputs.start }}..${{ inputs.end }}"
          git pull --rebase origin main
          git push
