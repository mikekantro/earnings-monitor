<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piper Sandler Portfolio Strategy Earnings Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0A0A;--paper:#FFFFFF;--rule:#E5E5E5;--muted:#666666}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;font-family:Inter,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column}
  .top{color:var(--ink);padding:16px 24px 0;border-bottom:1px solid var(--rule);background:#fff}
  .brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;max-width:1200px;margin:0 auto;width:100%}
  h1{font-family:Inter,Helvetica,Arial,sans-serif;font-weight:300;font-size:clamp(22px,2.6vw,28px);
     margin:0;letter-spacing:0;color:var(--ink)}
  .tag{font-family:Inter,Helvetica,Arial,sans-serif;font-size:10.5px;letter-spacing:.13em;
       text-transform:uppercase;color:var(--muted)}
  .tabs{display:flex;flex-wrap:nowrap;gap:5px;max-width:1200px;margin:14px auto 0;width:100%;overflow-x:auto}
  .tab{appearance:none;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
       white-space:nowrap;padding:9px 12px 11px;border-radius:0;flex:0 1 auto;
       background:transparent;border:0;border-bottom:3px solid transparent;
       color:#666666;margin-bottom:0}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:transparent;color:#1E5162;
       font-weight:600;border-bottom:3px solid #1E5162}
  .tab .m{font-family:Inter,Helvetica,Arial,sans-serif;font-size:10px;font-weight:400;color:inherit;
          opacity:.7;display:block;letter-spacing:.06em;margin-top:2px}
  .stage{flex:1;background:var(--paper);min-height:0}
  .pane{width:100%;height:100%;border:0;display:none}
  .pane.active{display:block}
  :focus-visible{outline:2px solid #1E5162;outline-offset:-2px}

/* brand */ .thesis,.fh,.vh,h1,h2{font-weight:300} .sh{font-weight:300} .thesis em,.fh em,.vh em,.sh em,h1 em,h2 em,.thesis i,h2 i{font-style:normal}

.lockup{display:flex;align-items:center;gap:9px;margin:0 0 6px;font-family:Inter,Helvetica,Arial,sans-serif}
.lockup b{font-weight:700;font-size:13px;letter-spacing:.06em;color:#0A0A0A}
.lockup i{width:2px;height:14px;background:#1E5162;display:inline-block}
.lockup span{font-weight:600;font-size:11px;letter-spacing:.14em;color:#666666}

h1 .firm{display:block;font-family:Inter,Helvetica,Arial,sans-serif;font-weight:700;font-size:12px;
letter-spacing:.12em;text-transform:uppercase;color:#666666;margin-bottom:3px}
h1 .firm::after{content:"";display:inline-block;width:2px;height:11px;background:#1E5162;margin-left:9px;vertical-align:-1px}

.wchg{max-width:1100px;margin:10px auto 0;padding:0 24px;font-size:12.5px;color:#4A4F54;line-height:1.55}
.wchg b{font-family:Inter,Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#C24F1F;margin-right:8px}

@media(max-width:1180px){.tab .m{display:none}.tab{padding:9px 10px;font-size:12.5px}}
@media(max-width:760px){.tabs{flex-wrap:wrap}.tab{flex:1 1 30%}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <h1><span class="firm">Piper Sandler Portfolio Strategy</span>Earnings Intelligence</h1>
    <span class="tag">S&amp;P 1500 · scored from every earnings call · data as of Nov 13, 2026</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Dashboards">
    <button class="tab" role="tab" id="t-pmi" aria-selected="true" data-pane="pmi">
      Earnings PMI<span class="m">scorecard</span></button>
    <button class="tab" role="tab" id="t-pricing" aria-selected="false" data-pane="pricing">
      Pricing<span class="m">inflation gauge</span></button>
    <button class="tab" role="tab" id="t-ai" aria-selected="false" data-pane="ai">
      AI Adoption<span class="m">who uses it</span></button>
    <button class="tab" role="tab" id="t-buildout" aria-selected="false" data-pane="buildout">
      Build-Out<span class="m">decomposed</span></button>
    <button class="tab" role="tab" id="t-emp" aria-selected="false" data-pane="emp">
      Employment<span class="m">on watch</span></button>
    <button class="tab" role="tab" id="t-refunds" aria-selected="false" data-pane="refunds">
      Refunds<span class="m">who keeps it</span></button>
    <button class="tab" role="tab" id="t-portfolio" aria-selected="false" data-pane="portfolio">
      Portfolio<span class="m">screen your book</span></button>
    <button class="tab" role="tab" id="t-readthrough" aria-selected="false" data-pane="readthrough">
      Read-Through<span class="m">who's next</span></button>
  </nav>
</div>
<div class="wchg"><!--WCHG--><b>What changed &middot; Nov 13, 2026</b> No new reporters or disclosures this refresh; scores and quotes re-verified. Prices index 60.2; Energy leads sector pricing momentum.<!--/WCHG--></div>
<div class="stage">
  <iframe class="pane active" id="p-pmi" title="Earnings PMI scorecard"
    src="pmi-scorecard/"></iframe>
  <iframe class="pane" id="p-pricing" title="Pricing power" data-src="pricing/"></iframe>
  <iframe class="pane" id="p-ai" title="AI adopters" data-src="ai-adopters/"></iframe>
  <iframe class="pane" id="p-buildout" title="AI build-out decomposition" data-src="buildout/"></iframe>
  <iframe class="pane" id="p-refunds" title="Tariff refund watch" data-src="refund-watch/"></iframe>
  <iframe class="pane" id="p-emp" title="AI and employment tracker" data-src="ai-employment/"></iframe>
  <iframe class="pane" id="p-portfolio" title="Portfolio screen" data-src="portfolio/"></iframe>
<iframe class="pane" id="p-readthrough" title="Peer read-through" data-src="read-through/"></iframe>
</div>
<script>
const tabs=[...document.querySelectorAll('.tab')];
function activate(name,push){
  tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.pane===name)));
  document.querySelectorAll('.pane').forEach(p=>{
    const on=p.id==='p-'+name;
    p.classList.toggle('active',on);
    if(on&&!p.src&&p.dataset.src)p.src=p.dataset.src;   // lazy-load on first open
  });
  if(push)history.replaceState(null,'','#'+name);
}
tabs.forEach(t=>t.addEventListener('click',()=>activate(t.dataset.pane,true)));
const h=location.hash.replace('#','');
if(['pmi','pricing','ai','buildout','refunds','emp','portfolio'].includes(h))activate(h,false);
// keyboard: arrow keys between tabs
document.querySelector('.tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true');
  const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];
  n.focus();activate(n.dataset.pane,true);
});
</script>
</body>
</html>
